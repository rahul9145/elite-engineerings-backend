<html>
    <head>
        <title></title>
        <style>
            body {
                height: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        </style>
    </head>
    <body style="font-family: Arial, Helvetica, sans-serif; color: #0e0f11; background: #f4f3ef;">
        <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-top: 4px solid #e5252b;">
            <div style="padding: 24px 28px; border-bottom: 1px solid #e6e3db;">
                <h1 style="margin: 0; font-size: 20px;">New enquiry from elite-engineerings.com</h1>
            </div>

            <table style="width: 100%; border-collapse: collapse; font-size: 14px;" cellpadding="0" cellspacing="0">
                <tr><td style="padding: 10px 28px; color: #767c85; width: 110px;">Name</td><td style="padding: 10px 28px 10px 0;"><strong>${name}</strong></td></tr>
                <tr><td style="padding: 10px 28px; color: #767c85;">Email</td><td style="padding: 10px 28px 10px 0;">${email}</td></tr>
                <tr><td style="padding: 10px 28px; color: #767c85;">Company</td><td style="padding: 10px 28px 10px 0;">${company}</td></tr>
                <tr><td style="padding: 10px 28px; color: #767c85;">Phone</td><td style="padding: 10px 28px 10px 0;">${phone}</td></tr>
                <tr><td style="padding: 10px 28px; color: #767c85;">Subject</td><td style="padding: 10px 28px 10px 0;">${title}</td></tr>
            </table>

            <div style="padding: 20px 28px 28px; border-top: 1px solid #e6e3db; font-size: 15px; line-height: 1.6;">
                <p style="margin: 0 0 8px; color: #767c85;">Message</p>
                <p style="margin: 0;">${message}</p>
            </div>
        </div>
    </body>
</html>
